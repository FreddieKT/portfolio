# ============================================================================
# CI Pipeline — Check → Test → Build
# Astro + TypeScript project baseline
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Sanity: whitespace + conflict markers
      - name: Sanity Check (whitespace)
        run: git diff --check

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Astro Type Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CSP hashes
        run: npm run csp
